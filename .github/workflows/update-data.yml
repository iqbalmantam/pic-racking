name: Update data.json

on:
  schedule:
    - cron: "*/15 * * * *"     # tiap 15 menit (GitHub kadang terlambat beberapa menit)
  workflow_dispatch:            # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kumpulkan data dari 33 sheet
        run: python scripts/build_data.py

      - name: Commit jika data berubah
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: update data.json"
            git pull --rebase
            git push
          else
            echo "Tidak ada perubahan."
          fi
