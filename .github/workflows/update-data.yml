name: Update Data Racking

on:
  schedule:
    - cron: '*/15 * * * *' # Berjalan otomatis tiap 15 menit
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run build script
        run: python scripts/build_data.py

      - name: Commit and push data.json if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update data.json otomatis [skip ci]" && git push)
